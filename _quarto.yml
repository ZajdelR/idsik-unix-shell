# This is the website configuration file
# For training developers:
#  Please do not edit this file
#  Contact us if something doesn't look right on your rendered website

project:
  type: book
  output-dir: _site
  render:
    - index.md
    - setup.md
    - materials.md
    - materials/*
    - "!materials/*/no_render"

format: crit-format-html
exercises:
  number: true
  hide-answers: false

filters:
  - callout-exercise
  - shell-selector

execute:
  freeze: auto

knitr:
  opts_knit:
    cache.path: .knitr_cache

metadata-files:
  - "materials/_chapters.yml"
  #- "materials/_sidebar.yml"

book:
  site-url: https://zajdelr.github.io/idsik-unix-shell/
  search:
    location: sidebar
  bread-crumbs: false
  page-navigation: true
  page-footer:
    center: |
      Licencja [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/)
      ![](https://creativecommons.org/images/deed/cc_icon_black_x2.png){width=25px}
  navbar:
    pinned: true
    title: "Zarządzanie projektem informatycznym (UPWr 2026/2027)"
  chapters:
    - part: "Wprowadzenie"
      chapters:
        - text: "Informacje ogólne"
          href: index.md
        - text: "Dane i przygotowanie środowiska"
          href: setup.md
